name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haberdasher-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      vars.HD_PUBLISH_ENABLED == 'true' &&
      github.ref == format('refs/heads/{0}',
      github.event.repository.default_branch)
    environment: publisher
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: "DeterminateSystems/nix-installer-action@\
          c5a866b6ab867e88becbed4467b93592bce69f8a" # v21
        with:
          determinate: true
      - name: Set up the pinned Python environment
        run: nix develop --no-write-lock-file --command just setup
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          HD_SIGNING_KEY: ${{ secrets.HD_SIGNING_KEY }}
          HD_CLOUDFLARE_S3_API_ENDPOINT: >-
            ${{ secrets.HD_CLOUDFLARE_S3_API_ENDPOINT }}
          HD_CLOUDFLARE_ACCESS_KEY_ID: >-
            ${{ secrets.HD_CLOUDFLARE_ACCESS_KEY_ID }}
          HD_CLOUDFLARE_SECRET_ACCESS_KEY: >-
            ${{ secrets.HD_CLOUDFLARE_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set +x
          nix develop --no-write-lock-file --command just publish
