[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "haberdasher"
version = "0.1.0"
description = "A private publisher for prebuilt GitHub release assets"
requires-python = ">=3.14"
dependencies = ["PyYAML==6.0.3"]

[dependency-groups]
dev = ["pytest>=8", "types-PyYAML>=6.0.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["tests/proofs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.basedpyright]
include = ["src", "tests/unit", "tests/conftest.py"]
exclude = ["tests/proofs", ".venv", "build"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportUnnecessaryIsInstance = false
venvPath = "."
venv = ".venv"
